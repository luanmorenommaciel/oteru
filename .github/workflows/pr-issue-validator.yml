name: Validate issue against PR

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Unit tests
        run: python -m pytest -q tools/pr_issue_validator/tests
      - name: Build evidence report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m tools.pr_issue_validator.cli
          --repo "${{ github.repository }}"
          --pr "${{ inputs.pr }}"
          --output pr-issue-validation.md
      - uses: actions/upload-artifact@v4
        with:
          name: pr-issue-validation-${{ inputs.pr }}
          path: pr-issue-validation.md
          if-no-files-found: error
