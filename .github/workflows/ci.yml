name: CI

# Lean default:
#   pull_request / push main (emitter or scripts paths) -> ubuntu + Python 3.13
#     only (lint, format, tests, smoke) + PII guard.
#   weekly (Mon 06:00 UTC) + workflow_dispatch -> full matrix
#     (ubuntu + windows) x (3.10 + 3.13), which keeps the Windows and
#     oldest-Python support claims proven without paying for them per PR.

on:
  push:
    branches: [main]
    paths:
      - "oteru-emitter/**"
      - "oteru-hooks/**"
      - "scripts/**"
      - "oteru-collector/**"
      - ".github/workflows/ci.yml"
      - "tests/**"
      - ".gitleaks.toml"
      - "oteru-dbt/seeds/**"
  pull_request:
    paths:
      - "oteru-emitter/**"
      - "oteru-hooks/**"
      - "scripts/**"
      - "oteru-collector/**"
      - ".github/workflows/ci.yml"
      - "tests/**"
      - ".gitleaks.toml"
      - "oteru-dbt/seeds/**"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly full OS x Python matrix

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1" # stable UTF-8 output on Windows consoles

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        # PRs and pushes: ubuntu + 3.13 only. Full matrix on dispatch/schedule.
        exclude:
          - os: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'windows-latest' || 'none' }}
          - python-version: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '3.10' || 'none' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: oteru-emitter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: oteru-emitter/pyproject.toml
      - name: Install (editable + dev)
        run: pip install -e ".[dev]"
      - name: Lint (ruff check)
        run: ruff check .
      - name: Formatting (ruff format --check)
        run: ruff format --check .
      - name: Tests
        run: pytest
      - name: Hook bridge (lint + tests)
        run: |
          ruff check ../oteru-hooks
          ruff format --check ../oteru-hooks
          pytest ../oteru-hooks/tests
      - name: Smoke (sample dry-run, no network)
        run: oteru-emitter replay samples/telemetry-sample.json --dry-run

  pii-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PII guard (committed captures)
        run: python scripts/check_pii.py
      - name: Chargeback seed guard
        run: python scripts/check_chargeback_seeds.py
      - name: Chargeback seed guard tests
        run: |
          # Same MIT CLI pin as collector-ocb.yml so the gitleaks rule tests run.
          ver=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          export PATH="/tmp:$PATH"
          python -m unittest discover -s tests -p "test_chargeback_seeds.py" -v

  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install -e "./oteru-emitter[dev]"
          python -m pip install -r oteru-collector/requirements-dev.txt
      - name: Lint Collector privacy code
        run: |
          python -m ruff check oteru-collector/privacy oteru-collector/tests scripts/apply_privacy.py
          python -m ruff format --check oteru-collector/privacy oteru-collector/tests scripts/apply_privacy.py
          bash -n scripts/check_signals_e2e.sh
      - name: Check static policy and topology
        run: python -m pytest oteru-collector/tests/test_policy.py oteru-collector/tests/test_configs.py oteru-collector/tests/test_chargeback_attrs.py oteru-collector/tests/test_hmac_lookup.py
      - name: Exercise isolated Collector, ClickHouse and OTLP forwarding
        run: python -m pytest oteru-collector/tests/test_runtime.py
