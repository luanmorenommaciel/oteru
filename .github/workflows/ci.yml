name: CI

on:
  push:
    branches: [main]
    paths:
      - "oteru-emitter/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "oteru-emitter/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"

env:
  PYTHONUTF8: "1" # saída PT-BR estável no console do Windows

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: oteru-emitter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instala (editable + dev)
        run: pip install -e ".[dev]"
      - name: Lint (ruff check)
        run: ruff check .
      - name: Formatação (ruff format --check)
        run: ruff format --check .
      - name: Testes
        run: pytest
      - name: Smoke (dry-run do sample, sem rede)
        run: oteru-emitter replay samples/telemetry-sample.json --dry-run

  pii-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guarda de PII (capturas commitadas)
        run: python scripts/check_pii.py
