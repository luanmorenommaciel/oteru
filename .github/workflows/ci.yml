name: CI

# Lean default:
#   pull_request / push main (emitter or scripts paths) -> ubuntu + Python 3.13
#     only (lint, format, tests, smoke) + PII guard.
#   weekly (Mon 06:00 UTC) + workflow_dispatch -> full matrix
#     (ubuntu + windows) x (3.10 + 3.13), which keeps the Windows and
#     oldest-Python support claims proven without paying for them per PR.

on:
  push:
    branches: [main, feat/115-ingestor-go-xnet]
    paths:
      - "oteru-emitter/**"
      - "oteru-ingestor/**"
      - "oteru-hooks/**"
      - "scripts/**"
      - "scripts/check_ingestor.sh"
      - "oteru-collector/docker-compose.ingestor.yml"
      - "Makefile"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "oteru-emitter/**"
      - "oteru-ingestor/**"
      - "oteru-hooks/**"
      - "scripts/**"
      - "scripts/check_ingestor.sh"
      - "oteru-collector/docker-compose.ingestor.yml"
      - "Makefile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly full OS x Python matrix

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1" # stable UTF-8 output on Windows consoles

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        # PRs and pushes: ubuntu + 3.13 only. Full matrix on dispatch/schedule.
        exclude:
          - os: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'windows-latest' || 'none' }}
          - python-version: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '3.10' || 'none' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: oteru-emitter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: oteru-emitter/pyproject.toml
      - name: Install (editable + dev)
        run: pip install -e ".[dev]"
      - name: Lint (ruff check)
        run: ruff check .
      - name: Formatting (ruff format --check)
        run: ruff format --check .
      - name: Tests
        run: pytest
      - name: Hook bridge (lint + tests)
        run: |
          ruff check ../oteru-hooks
          ruff format --check ../oteru-hooks
          pytest ../oteru-hooks/tests
      - name: Smoke (sample dry-run, no network)
        run: oteru-emitter replay samples/telemetry-sample.json --dry-run

  pii-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PII guard (committed captures)
        run: python scripts/check_pii.py

  ingestor-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: oteru-emitter/pyproject.toml
      - name: Install emitter venv
        run: make setup
      - name: Ephemeral ClickHouse password
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::${pw}"
          {
            printf 'CLICKHOUSE_PASSWORD=%s\n' "${pw}"
            printf 'CLICKHOUSE_URL=http://localhost:8123/?user=otel&password=%s\n' "${pw}"
          } >> "${GITHUB_ENV}"
      - name: make up-ingestor
        run: make up-ingestor
      - name: make ingestor-check
        run: make ingestor-check
      - name: make down-ingestor
        if: always()
        run: make down-ingestor

  # Same 11 SPEC.md checks as ingestor-check, against the Go implementation
  # (IMPL=go builds oteru-ingestor/go via its Dockerfile). Existing
  # ingestor-check stays Python-only; this job does not loosen it.
  ingestor-go-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: oteru-emitter/pyproject.toml
      - name: Install emitter venv
        run: make setup
      - name: Ephemeral ClickHouse password
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::${pw}"
          {
            printf 'CLICKHOUSE_PASSWORD=%s\n' "${pw}"
            printf 'CLICKHOUSE_URL=http://localhost:8123/?user=otel&password=%s\n' "${pw}"
          } >> "${GITHUB_ENV}"
      - name: make up-ingestor
        run: make up-ingestor IMPL=go
      - name: make ingestor-check
        run: make ingestor-check IMPL=go
      - name: make down-ingestor
        if: always()
        run: make down-ingestor

  ingestor-go-vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: oteru-ingestor/go
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: oteru-ingestor/go/go.sum
      - name: go mod download
        run: |
          for attempt in 1 2 3; do
            go mod download && break
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
