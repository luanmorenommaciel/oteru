[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oteru-emitter"
version = "0.1.0"
description = "Forja tráfego de telemetria OTLP fiel ao Claude Code (replay + futuro gerador sintético)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Oteru / AVAD" }]
dependencies = [
    "opentelemetry-proto>=1.20.0",
    "grpcio>=1.50.0",
    "requests>=2.28.0",
]

[project.scripts]
oteru-emitter = "oteru_emitter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oteru_emitter*"]
