[package]
name = "oteru-ingestor"
version = "0.1.0"
edition = "2024"
description = "oteru-ingestor, Rust implementation (#26) — see ../SPEC.md"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.23"
flate2 = "1"
hex = "0.4"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "logs", "metrics", "trace", "with-serde"] }
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["query"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
