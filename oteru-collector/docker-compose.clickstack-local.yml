# Compose override: adds HyperDX all-in-one (ClickStack) as the backend and
# swaps in the forwarding config for the collector. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.clickstack-local.yml up -d
# (or simply `make up-clickstack-local` from the monorepo root).
#
# Unlike docker-compose.hyperdx.yml — which is only a read-only UI in front of
# the repo's own ClickHouse — this makes ClickStack the backend: telemetry is
# written into the all-in-one's bundled ClickHouse (needs an ingestion API key,
# see scripts/hyperdx_bootstrap.sh).
#
# HyperDX's OTLP ports (4317/4318) are intentionally NOT exposed to the host —
# the collector reaches them via the internal Docker network (service name: hyperdx).
# Only the UI port (8080) is published.
services:
  oteru-collector:
    volumes:
      - ./oteru-collector-config.clickstack-local.yml:/etc/oteru-collector-config.yml
      - ./telemetry:/telemetry
    environment:
      HYPERDX_API_KEY: ${HYPERDX_API_KEY:-}
    depends_on:
      - hyperdx

  hyperdx:
    image: docker.hyperdx.io/hyperdx/hyperdx-all-in-one
    ports:
      - "8080:8080"
    # Persist across recreates: telemetry (ClickHouse) + accounts/dashboards/
    # API keys (MongoDB). Remove with `docker compose down -v` when you want
    # a factory reset.
    volumes:
      - hyperdx-clickhouse:/var/lib/clickhouse
      - hyperdx-mongo:/data/db

volumes:
  hyperdx-clickhouse:
  hyperdx-mongo:
