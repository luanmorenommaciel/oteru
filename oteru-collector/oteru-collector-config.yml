receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed
  # Writes every received payload as JSON (one line per batch) to /telemetry,
  # which is bind-mounted to ./telemetry on the host. rotation avoids a huge file.
  file:
    path: /telemetry/telemetry.json
    rotation:
      max_megabytes: 10
      max_backups: 5

service:
  # Expose the collector's own metrics (otelcol_*) on all interfaces so Docker
  # port-publishing can reach them. Without this block v0.155 binds :8888 to
  # localhost inside the container, unreachable from the host even if published.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, file]
    logs:
      receivers: [otlp]
      exporters: [debug, file]
    metrics:
      receivers: [otlp]
      exporters: [debug, file]
